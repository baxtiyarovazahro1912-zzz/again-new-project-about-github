<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bosh sahifa</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
        }
        header {
            background-color: #2c3e50;
            color: #fff;
            padding: 20px 0;
            text-align: center;
        }
        nav {
            margin-top: 10px;
        }
        nav a {
            color: #ecf0f1;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        nav a:hover {
            color: #3498db;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .card {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            background-color: #3498db;
            color: #fff;
            padding: 12px 24px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        footer {
            text-align: center;
            padding: 20px;
            margin-top: 50px;
            color: #777;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <header>
        <h2>Mening Veb-Saytim</h2>
        <nav>
            <a href="#">Bosh sahifa</a>
            <a href="#">Biz haqimizda</a>
            <a href="#">Xizmatlar</a>
            <a href="#">Aloqa</a>
        </nav>
    </header>

    <div class="container">
        <div class="card">
            <h1>Xush kelibsiz!</h1>
            <p>Bu <code>index.html</code> faylingizning tayyor strukturasi va chiroyli dizayni.</p>
            <a href="#" class="btn" onclick="alert('Xush kelibsiz!')">Batafsil</a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Mening Veb-Saytim. Barcha huquqlar himoyalangan.</p>
    </footer>
</body>
</html>
